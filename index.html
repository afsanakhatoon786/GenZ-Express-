<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenZ Express News</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; color: #1c1e21; }
    header { background: #cc0000; color: white; padding: 15px; text-align: center; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .news-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
    .news-card img { width: 100%; height: 160px; object-fit: cover; background: #e4e6eb; }
    .news-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .news-tag { background: #ffebee; color: #cc0000; font-size: 11px; padding: 3px 8px; border-radius: 4px; width: fit-content; margin-bottom: 8px; font-weight: bold; }
    .news-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #111; line-height: 1.3; }
    .news-desc { font-size: 13px; color: #555; margin-bottom: 12px; flex-grow: 1; line-height: 1.4; }
    .news-date { font-size: 11px; color: #888; margin-bottom: 10px; }
    .ad-banner-top { background: #e4e6eb; border: 2px dashed #999; text-align: center; padding: 15px; font-weight: bold; color: #555; margin-bottom: 20px; border-radius: 6px; }
    .ad-box-sidebar { background: #e4e6eb; border: 2px dashed #999; text-align: center; padding: 40px 10px; font-weight: bold; color: #555; border-radius: 6px; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <h1>GenZ Express News</h1>
  </header>

  <div class="container">
    <main>
      <div class="ad-banner-top">
        📢 Advertisement Space
      </div>

      <div class="news-grid" id="newsGrid">
        <p>Articles load ho rahe hain...</p>
      </div>
    </main>

    <aside class="sidebar">
      <div class="ad-box-sidebar">
        📢 Sidebar Ad Space
      </div>
    </aside>
  </div>

  <script>
    async function loadArticles() {
      const newsGrid = document.getElementById('newsGrid');
      try {
        // GitHub API se content/news folder ki files read karna
        const response = await fetch('https://api.github.com/repos/afsanakhatoon786/GenZ-Express/contents/content/news');
        const files = await response.json();

        if (!Array.isArray(files) || files.length === 0) {
          newsGrid.innerHTML = '<p>Abhi koi article nahi hai. Admin panel se pehla article post karein!</p>';
          return;
        }

        newsGrid.innerHTML = '';
        for (let file of files) {
          if (file.name !== 'placeholder.txt') {
            const res = await fetch(file.download_url);
            const article = await res.json();
            
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
              <img src="${article.image || 'https://via.placeholder.com/300x160'}" alt="News Image">
              <div class="news-content">
                <span class="news-tag">${article.category || 'General'}</span>
                <div class="news-date">🗓️ ${article.date || ''}</div>
                <h3 class="news-title">${article.title || ''}</h3>
                <p class="news-desc">${article.description || ''}</p>
              </div>
            `;
            newsGrid.appendChild(card);
          }
        }
      } catch (error) {
        newsGrid.innerHTML = '<p>Khabar load karne mein samasya aayi. Admin Panel se naya post karein.</p>';
      }
    }

    window.onload = loadArticles;
  </script>

</body>
</html>
